models:
  - name: customers
    semantic_model:
      enabled: true
    description: Location and description of all customers.
    agg_time_dimension: ds
    columns:
      - name: id_customer
        entity:
          type: primary
          name: customer
      - name: country
        entity:
          type: foreign
        dimension:
          type: categorical
          name: customer_country
      - name: ds
        dimension:
          type: time
        granularity: day
    metrics:
      - name: new_customers
        type: simple
        label: "New Customer"
        agg: sum
        expr: "1"